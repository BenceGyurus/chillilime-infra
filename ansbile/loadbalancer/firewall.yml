- name: Firewall
  hosts: loadbalancer
  become: true

  tasks:
    - name: Install ufw
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true

    - name: Default deny incoming
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Default allow outgoing
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP and HTTPS
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
        log: true
      loop:
        - "80"
        - "443"

    - name: Allow metrics from the monitoring VM
      community.general.ufw:
        rule: allow
        from_ip: "10.1.1.4"
        port: "{{ item }}"
        proto: tcp
      loop:
        - "9100"
        - "9101"

    - name: Enable UFW
      community.general.ufw:
        state: enabled
