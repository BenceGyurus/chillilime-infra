http:
  routers:
    mc-router:
      rule: "Host(`mc.gyurus.hu`)"
      entryPoints:
        - websecure
      service: mc-service
      tls:
        certResolver: letsencrypt

  services:
    mc-service:
      loadBalancer:
        serversTransport: mc-transport
        servers:
          - url: "https://10.1.1.3:8443"

  serversTransports:
    mc-transport:
      insecureSkipVerify: true