global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # --- Prometheus itself ---
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # --- Proxmox Exporter ---
  - job_name: 'pve'
    static_configs:
      - targets:
        - 10.1.1.2  # Proxmox VE node.
    metrics_path: /pve
    params:
      module: [default]
      cluster: ['1']
      node: ['1']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221

  # --- VM host metrics ---

  - job_name: 'node-exporter-minecraft-vm'
    static_configs:
      - targets: ['10.1.1.3:9100']

  - job_name: 'node-exporter-monitor-vm'
    static_configs:
      - targets: ['10.1.1.4:9100']


  - job_name: 'opnsense-exporter'
    static_configs:
      - targets: ['opnsense-exporter:8080']


  - job_name: 'entry-traefik-loadbalancer'
    static_configs:
      - targets: ['10.1.1.254:9101']

  - job_name: 'node-exporter-loadbalancer'
    static_configs:
      - targets: ['10.1.1.254:9100']
