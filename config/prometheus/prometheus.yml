global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # --- Prometheus itself ---
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # --- Proxmox Exporter ---
  - job_name: 'pve'
    static_configs:
      - targets:
        - 10.1.1.2  # Proxmox VE node.
    metrics_path: /pve
    params:
      module: [default]
      cluster: ['1']
      node: ['1']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 192.168.100.17:9221

  # --- Adguard Exporter ----
  
  - job_name: 'adguard'
    static_configs:
      - targets: ['192.168.100.17:9618']

  # --- Treafik Exporter ----
  
  - job_name: 'treafik-docker'
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ['192.168.100.17:8080']

  - job_name: 'treafik-loadbalancer'
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ['192.168.100.248:9100']
  
  - job_name: 'treafik-kubernetes'
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ['192.168.100.248:9100']

  - job_name: 'immich'
    scrape_interval: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ['192.168.100.17:8081']
  
  - job_name: 'proxmox-smart'
    metrics_path: /metrics
    static_configs:
      - targets: ['192.168.100.100:9633']
  
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['192.168.100.17:8082']

  - job_name: 'node'
    static_configs:
      - targets: ['192.168.100.17:9101']
  
  - job_name: 'docker'
    static_configs:
      - targets: ['host.docker.internal:9323']
  
  - job_name: 'cadvisor-torrent'
    static_configs:
      - targets: ['192.168.100.85:8082']

  - job_name: 'node-torrent'
    static_configs:
      - targets: ['192.168.100.85:9101']

  - job_name: 'scraparr'
    static_configs:
      - targets: ['192.168.100.85:7100']
    
  - job_name: 'crafty'
    scheme: https
    static_configs:
      - targets: ['mc.gyurus.hu']


  - job_name: 'dcgm-exporter'
    static_configs:
      - targets: ['192.168.100.46:9400']

  - job_name: "cloudflared"
    static_configs:
      - targets: ["192.168.100.254:60123"]

  - job_name: "harbor"
    static_configs:
      - targets: ["192.168.100.18:9091"]

  - job_name: 'harbor-core'
    params:
      comp: ['core']
    static_configs:
      - targets: ['192.168.100.18:9091']

  - job_name: 'harbor-registry'
    params:
      comp: ['registry']
    static_configs:
      - targets: ['192.168.100.18:9091']

  - job_name: 'harbor-jobservice'
    params:
      comp: ['jobservice']
    static_configs:
      - targets: ['192.168.100.18:9091']