version: '3'
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - /opt/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/prometheus:/prometheus
    restart: unless-stopped

  # --- Grafana ---
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    env_files:
      - .env
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL}
    volumes:
      - /opt/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped


# --- EXPORTERS ---
  opnsense-exporter:
    image: ghcr.io/athennamind/opnsense-exporter:latest
    container_name: opensense-exporter
    restart: always
    env_files:
      - .env
    command:
      - --opnsense.protocol=https
      - --opnsense.address=10.1.1.1
      - --exporter.instance-label=instance1
      - --web.listen-address=:8080
    environment:
      OPNSENSE_EXPORTER_OPS_API_KEY: ${OPNSENSE_EXPORTER_OPS_API_KEY}
      OPNSENSE_EXPORTER_OPS_API_SECRET: ${OPNSENSE_EXPORTER_OPS_API_SECRET}
    ports:
      - "8080:8080"
  
