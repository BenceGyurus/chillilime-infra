services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?Set GF_SECURITY_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:?Set GF_SERVER_ROOT_URL in .env}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  opnsense-exporter:
    image: ghcr.io/athennamind/opnsense-exporter:latest
    container_name: opnsense-exporter
    restart: unless-stopped
    command:
      - --opnsense.protocol=https
      - --opnsense.address=10.1.1.1
      - --exporter.instance-label=instance1
      - --web.listen-address=:8080
      - --opnsense.insecure
    environment:
      OPNSENSE_EXPORTER_OPS_API_KEY: ${OPNSENSE_EXPORTER_OPS_API_KEY:?Set OPNSENSE_EXPORTER_OPS_API_KEY in .env}
      OPNSENSE_EXPORTER_OPS_API_SECRET: ${OPNSENSE_EXPORTER_OPS_API_SECRET:?Set OPNSENSE_EXPORTER_OPS_API_SECRET in .env}

  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: pve-exporter
    restart: unless-stopped
    volumes:
      - ./pve-exporter/pve.yml:/etc/prometheus/pve.yml:ro

volumes:
  prometheus-data:
    driver: local
    driver_opts:
        type: none
        o: bind
        device: /home/monitoring/prometheus/data
  grafana-data:
    driver: local
    driver_opts:
        type: none
        o: bind
        device: /home/monitoring/grafana/data